[project]
name = "imagine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.30.0",
    "inspect-ai>=0.3.285",
    "inspect-flow>=0.14.0",
    "mlx-lm>=0.32.2",
    "sacrebleu>=2.6.0",
    "truststore>=0.10.5",
]

# Registra en Inspect AI el proveedor mlx/ y las tareas imagine/niebla e imagine/prosa.
[project.entry-points.inspect_ai]
imagine = "imagine.integraciones.inspect"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
